<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#2563eb">
<title>Pulizie — Gestione Stanze</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="page-locked">

<div id="accessGate">
  <form class="access-card" id="accessForm">
    <div class="access-title">🧹 MusArt Pulizie</div>
    <div class="access-subtitle">Inserisci la password per accedere.</div>
    <label class="lbl" for="accessPassword">Password</label>
    <input class="inp" id="accessPassword" type="password" inputmode="numeric"
      autocomplete="current-password" required autofocus>
    <div class="access-error" id="accessError" role="alert" hidden>Password non corretta.</div>
    <button class="btn btn-primary" type="submit">Entra</button>
  </form>
</div>


<header>
  <div class="h-row">
    <div class="brand">
      <span class="sync-dot" id="syncDot"></span>
      <span>🧹 Pulizie</span>
    </div>
    <div class="h-actions">
      <button class="icon-btn" id="refreshBtn" title="Aggiorna"><span id="refreshIcon">⟳</span></button>
      <button class="icon-btn" id="lockBtn" title="Accesso">🔒</button>
    </div>
  </div>
  <div class="h-sub">
    <span id="lastUpdate">Ultimo aggiornamento: —</span>
    <span class="right" id="syncStatus"></span>
  </div>
</header>

<main id="main"></main>
<nav id="nav"></nav>
<div id="modal"></div>

<script type="module" src="app.js"></script>
</body>
</html>
