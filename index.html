<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#2563eb">
<title>Pulizie — Gestione Stanze</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --primary:#2563eb;--primary-dark:#1e40af;--success:#16a34a;--success-bg:#f0fdf4;
  --warning:#ea580c;--warning-bg:#fff7ed;--bg:#f1f5f9;--card:#fff;
  --text:#0f172a;--muted:#64748b;--border:#e2e8f0;--danger:#dc2626;
}
html{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--text);font-size:16px;line-height:1.4;
  padding-top:92px;padding-bottom:84px;min-height:100%;
  -webkit-font-smoothing:antialiased;
}
header{
  position:fixed;top:0;left:0;right:0;z-index:100;
  background:linear-gradient(135deg,#2563eb,#1e40af);color:#fff;
  padding:10px 16px 9px;box-shadow:0 2px 10px rgba(0,0,0,.15);
}
.h-row{display:flex;align-items:center;justify-content:space-between}
.brand{font-size:18px;font-weight:800;letter-spacing:.3px;display:flex;align-items:center;gap:8px}
.sync-dot{width:9px;height:9px;border-radius:50%;background:#94a3b8;
  box-shadow:0 0 0 3px rgba(255,255,255,.2);transition:.3s}
.sync-dot.ok{background:#4ade80;box-shadow:0 0 0 3px rgba(74,222,128,.3)}
.sync-dot.stale{background:#fbbf24;box-shadow:0 0 0 3px rgba(251,191,36,.3)}
.sync-dot.err{background:#f87171;box-shadow:0 0 0 3px rgba(248,113,113,.3)}
.sync-dot.loading{background:#fff;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.h-actions{display:flex;gap:6px}
.icon-btn{
  background:rgba(255,255,255,.18);border:none;color:#fff;
  width:36px;height:36px;border-radius:10px;font-size:17px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:.15s;
}
.icon-btn:active{background:rgba(255,255,255,.34);transform:scale(.95)}
.icon-btn .spin{display:inline-block;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.h-sub{font-size:11px;opacity:.9;margin-top:6px;font-weight:500;
  display:flex;justify-content:space-between;align-items:center;gap:8px}
.h-sub .right{opacity:.85}
main{padding:12px 14px 20px;max-width:640px;margin:0 auto}
.view-title{font-size:20px;font-weight:800;margin:4px 0 14px;padding-left:2px}
.section-title{font-size:12px;font-weight:800;color:var(--muted);
  text-transform:uppercase;letter-spacing:.6px;margin:18px 4px 8px}
.dashboard{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px}
.stat{background:#fff;border-radius:14px;padding:12px 6px;text-align:center;
  box-shadow:0 1px 3px rgba(0,0,0,.06)}
.stat.wide{grid-column:1 / -1;padding:14px}
.stat-num{font-size:26px;font-weight:800;color:var(--primary);line-height:1}
.stat-lbl{font-size:10px;color:var(--muted);margin-top:5px;font-weight:700;
  text-transform:uppercase;letter-spacing:.3px}
.stat-date{font-size:10px;color:var(--muted);margin-top:2px;font-weight:600}
.error-box{background:#fef2f2;color:#991b1b;padding:12px 14px;border-radius:12px;
  font-size:12.5px;margin-bottom:14px;border-left:4px solid var(--danger);line-height:1.5}
.empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:14px;line-height:1.6}
.no-clean{color:#94a3b8;font-size:13px;font-style:italic;padding:4px 6px 10px}
.day-block{margin-bottom:20px}
.day-header{font-size:12.5px;font-weight:800;color:var(--muted);
  text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px;padding-left:4px}
.clean-card{background:#fff;border-radius:16px;padding:16px;margin-bottom:10px;
  box-shadow:0 1px 4px rgba(0,0,0,.07);border-left:5px solid var(--primary);transition:.15s}
.clean-card.both{border-left-color:var(--warning);background:var(--warning-bg)}
.cc-top{display:flex;align-items:center;justify-content:space-between}
.cc-room{font-size:17px;font-weight:800;letter-spacing:.2px}
.cc-info{font-size:13.5px;color:var(--muted);margin-top:5px;font-weight:600}
.cc-both{display:inline-block;margin-top:9px;font-size:11.5px;font-weight:800;
  color:#9a3412;background:#ffedd5;padding:5px 10px;border-radius:8px;letter-spacing:.2px;display:none}
.cc-guest{font-size:13px;color:var(--muted);margin-top:7px}
.cc-src{font-size:10.5px;color:#94a3b8;margin-top:6px;font-weight:600}
.btn{display:block;width:100%;border:none;border-radius:12px;padding:14px;
  font-size:15.5px;font-weight:800;cursor:pointer;margin-top:12px;
  font-family:inherit;transition:.12s;letter-spacing:.2px}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-primary{background:var(--primary);color:#fff}
.btn-danger{background:#fee2e2;color:#991b1b}
.btn-outline{background:#fff;color:var(--text);border:1.5px solid var(--border)}
.btn-close{background:#f1f5f9;color:var(--muted)}
.cal-wrap{background:#fff;border-radius:16px;padding:8px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.cal-grid{display:grid;grid-template-columns:1.35fr 1fr 1fr 1fr 1fr;gap:4px}
.cal-cell{display:flex;align-items:center;justify-content:center;
  padding:9px 2px;border-radius:9px;font-size:13px;font-weight:700;min-height:42px}
.cal-head{font-size:10.5px;color:var(--muted);text-transform:uppercase;
  font-weight:800;background:#f8fafc;letter-spacing:.3px}
.cal-date{justify-content:flex-start;padding-left:9px;font-size:11.5px;
  background:#f8fafc;color:var(--text)}
.cal-date.today{background:var(--primary);color:#fff}
.cal-status{font-size:16px;cursor:pointer;background:#f8fafc;transition:.12s}
.cal-status:active{transform:scale(.92)}
.cal-status.today{background:#e0e7ff}
.cal-status.free{color:#cbd5e1;font-size:19px}
.cal-status.needs-cleaning{background:#16a34a;color:#fff}
.cal-status.no-cleaning{background:#e2e8f0;color:#64748b}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;
  font-size:12.5px;color:var(--muted);font-weight:600;padding:0 4px}
.legend>div{display:flex;align-items:center;gap:7px}
.legend .lg{font-size:16px}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;
  box-shadow:0 1px 4px rgba(0,0,0,.06)}
.card-title{font-size:15px;font-weight:800;margin-bottom:4px}
.card-sub{font-size:13px;color:var(--muted);margin-bottom:10px}
.lbl{display:block;font-size:11.5px;font-weight:800;color:var(--muted);
  text-transform:uppercase;letter-spacing:.4px;margin:12px 0 6px}
.lbl:first-child{margin-top:0}
.inp{width:100%;padding:12px 13px;border:1.5px solid var(--border);border-radius:11px;
  font-size:14px;font-family:inherit;background:#f8fafc;color:var(--text);
  transition:.15s;outline:none}
.inp:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.hint{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.5}
.detected{font-size:11.5px;color:var(--success);margin-top:6px;font-weight:600;
  display:flex;align-items:center;gap:5px}
.row-toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;
  font-size:14px;font-weight:600;cursor:pointer;padding:4px 0}
.row-toggle input{width:22px;height:22px;accent-color:var(--primary);cursor:pointer}
.footer-note{text-align:center;font-size:11.5px;color:#94a3b8;padding:16px 10px 4px;line-height:1.5}

.src-badge{display:inline-block;font-size:10px;font-weight:800;
  padding:3px 8px;border-radius:6px;margin-left:6px;vertical-align:middle;
  letter-spacing:.2px ;display:none}
.src-badge.direct{background:#dbeafe;color:#1e40af}

nav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:#fff;
  display:flex;box-shadow:0 -2px 14px rgba(0,0,0,.09);
  padding-bottom:env(safe-area-inset-bottom)}
.nav-btn{flex:1;background:none;border:none;padding:8px 4px 10px;display:flex;
  flex-direction:column;align-items:center;gap:3px;cursor:pointer;
  color:var(--muted);font-family:inherit;transition:.15s}
.nav-btn.active{color:var(--primary)}
.nav-btn:active{transform:scale(.94)}
.nav-icon{font-size:21px;line-height:1}
.nav-label{font-size:10.5px;font-weight:800;letter-spacing:.2px}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:200;
  display:flex;align-items:flex-end;justify-content:center;padding:14px;
  animation:fadeIn .15s ease}
.modal{background:#fff;border-radius:20px;padding:22px;width:100%;max-width:480px;
  animation:slideUp .22s cubic-bezier(.16,1,.3,1);max-height:85vh;overflow-y:auto}
.modal-title{font-size:20px;font-weight:800;margin-bottom:3px}
.modal-date{font-size:13px;color:var(--muted);margin-bottom:16px;font-weight:600}
.modal-status{display:inline-block;padding:8px 14px;border-radius:10px;
  font-size:14px;font-weight:800;margin-bottom:14px;background:#f1f5f9}
.modal-status.checkout{background:#dbeafe;color:#1e40af}
.modal-status.both{background:#ffedd5;color:#9a3412}
.modal-status.occupied{background:#dcfce7;color:#166534}
.modal-status.free{background:#f1f5f9;color:#64748b}
.modal-row{font-size:14.5px;font-weight:600;padding:10px 0;
  border-bottom:1px solid var(--border);color:var(--text)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
@media(min-width:480px){.modal-bg{align-items:center}}
#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(20px);
  background:#0f172a;color:#fff;padding:12px 22px;border-radius:12px;font-size:14px;
  font-weight:700;z-index:300;opacity:0;pointer-events:none;transition:.25s;
  box-shadow:0 8px 24px rgba(0,0,0,.25);white-space:nowrap;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>

<body>

<header>
  <div class="h-row">
    <div class="brand">
      <span class="sync-dot" id="syncDot"></span>
      <span>🧹 Pulizie</span>
    </div>
    <div class="h-actions">
      <button class="icon-btn" id="refreshBtn" title="Aggiorna"><span id="refreshIcon">⟳</span></button>
      <button class="icon-btn" id="lockBtn" title="Accesso">🔒</button>
    </div>
  </div>
  <div class="h-sub">
    <span id="lastUpdate">Ultimo aggiornamento: —</span>
    <span class="right" id="syncStatus"></span>
  </div>
</header>

<main id="main"></main>
<nav id="nav"></nav>
<div id="modal"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {
  doc,
  getDoc,
  getFirestore,
  serverTimestamp,
  setDoc
} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';

const firebaseApp = initializeApp({
  apiKey: 'AIzaSyCWBSF491f3qG6F7MNg4Qsiz0B_9h98Ce8',
  authDomain: 'calendario-690a0.firebaseapp.com',
  projectId: 'calendario-690a0',
  storageBucket: 'calendario-690a0.firebasestorage.app',
  messagingSenderId: '510169773023',
  appId: '1:510169773023:web:fd4150eab5afa5960b8a6a'
});
const db = getFirestore(firebaseApp);
const settingsRef = doc(db, 'apps', 'pulizie');

/* ============================================================
   COSTANTI
============================================================ */
const PIN_ADMIN = '1234';
const AUTO_UPDATE_MS = 60 * 60 * 1000;
const VISIBILITY_THRESHOLD_MS = 30 * 60 * 1000;
const STALE_MS = 90 * 60 * 1000;
const VERY_STALE_MS = 24 * 60 * 60 * 1000;

const GIORNI = ['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'];
const MESI = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno',
              'Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
const MESI_BREVI = ['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'];

const DEFAULT_ROOM = {
  name: 'Stanza',
  airbnb: '',
  booking: ''
};

const DEFAULT_SETTINGS = {
  rooms: [
    { ...DEFAULT_ROOM, name: 'Stanza 1' },
    { ...DEFAULT_ROOM, name: 'Stanza 2' },
    { ...DEFAULT_ROOM, name: 'Stanza 3' },
    { ...DEFAULT_ROOM, name: 'Stanza 4' }
  ],
  showGuestName: false,
  checkoutTime: '10:00',
  checkinTime: '15:00',
  proxy: 'https://api.allorigins.win/raw?url='
};

/* ============================================================
   STATO
============================================================ */
const state = {
  view: 'home',
  settings: null,
  events: [],
  detectedNames: {},
  isAdmin: false,
  lastUpdate: null,
  fetching: false,
  fetchProgress: { done: 0, total: 0 },
  errorMsg: null,
  lastErrorAt: null,
  cloudError: null
};

/* ============================================================
   PERSISTENZA
============================================================ */
function loadAll() {
  let rawSettings = null;
  try {
    rawSettings = JSON.parse(localStorage.getItem('pulizie_settings_v3') || 'null');
  } catch (e) {
    rawSettings = null;
  }
  const storedRooms = rawSettings && Array.isArray(rawSettings.rooms)
    ? rawSettings.rooms
    : [];
  const legacyGoogleRooms = storedRooms.map(
    r => r.source === 'google' || Boolean(r.google)
  );
  const hasLegacyRoomSettings = storedRooms.some(
    r => r.source !== undefined || r.google !== undefined
  );
  state.settings = normalizeSettings(rawSettings || DEFAULT_SETTINGS);
  if (hasLegacyRoomSettings) saveSettingsLS();

  try { state.events = JSON.parse(localStorage.getItem('pulizie_events') || '[]'); }
  catch (e) { state.events = []; }
  if (!Array.isArray(state.events)) state.events = [];
  const events = state.events.filter(e => e.source !== 'Google');
  if (events.length !== state.events.length) {
    state.events = events;
    localStorage.setItem('pulizie_events', JSON.stringify(state.events));
  }
  try { state.detectedNames = JSON.parse(localStorage.getItem('pulizie_detected') || '{}'); }
  catch (e) { state.detectedNames = {}; }
  if (legacyGoogleRooms.some(Boolean)) {
    legacyGoogleRooms.forEach((wasGoogle, i) => {
      if (wasGoogle) delete state.detectedNames[i];
    });
    saveDetectedLS();
  }

  state.lastUpdate = localStorage.getItem('pulizie_lastupdate') || null;
  state.lastErrorAt = localStorage.getItem('pulizie_lasterror') || null;
  state.isAdmin = localStorage.getItem('pulizie_admin') === '1';
}
function normalizeSettings(settings) {
  const normalized = Object.assign({}, DEFAULT_SETTINGS, settings, {
    rooms: Array.isArray(settings.rooms) ? settings.rooms : []
  });
  normalized.rooms = normalized.rooms.map(r => {
    const base = { ...DEFAULT_ROOM, ...r };
    delete base.source;
    delete base.google;
    if (typeof base.airbnb !== 'string') base.airbnb = '';
    if (typeof base.booking !== 'string') base.booking = '';
    if (!base.name) base.name = 'Stanza';
    return base;
  });
  while (normalized.rooms.length < 4) {
    normalized.rooms.push({ ...DEFAULT_ROOM, name: 'Stanza ' + (normalized.rooms.length + 1) });
  }
  return normalized;
}
async function loadCloudSettings() {
  const snapshot = await getDoc(settingsRef);
  if (snapshot.exists()) {
    const cloudSettings = snapshot.data().settings;
    if (!cloudSettings || typeof cloudSettings !== 'object') {
      throw new Error('Le impostazioni salvate su Firebase non sono valide.');
    }
    state.settings = normalizeSettings(cloudSettings);
  } else {
    await setDoc(settingsRef, {
      settings: state.settings,
      updatedAt: serverTimestamp()
    });
  }
  saveSettingsLS();
}
async function saveCloudSettings() {
  await setDoc(settingsRef, {
    settings: state.settings,
    updatedAt: serverTimestamp()
  });
  state.cloudError = null;
}
function saveSettingsLS() { localStorage.setItem('pulizie_settings_v3', JSON.stringify(state.settings)); }
function saveDetectedLS() { localStorage.setItem('pulizie_detected', JSON.stringify(state.detectedNames)); }

/* ============================================================
   DATE
============================================================ */
function toKey(d) {
  return d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0');
}
function fromKey(k) {
  const [y, m, d] = k.split('-').map(Number);
  return new Date(y, m - 1, d);
}
function addDays(d, n) {
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  x.setDate(x.getDate() + n);
  return x;
}
function shortDate(d) { return d.getDate() + ' ' + MESI_BREVI[d.getMonth()]; }
function formatTime(iso) {
  const d = new Date(iso);
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function formatDateTime(iso) {
  const d = new Date(iso);
  return d.getDate() + ' ' + MESI_BREVI[d.getMonth()] + ' ' +
    String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function timeSince(isoString) {
  if (!isoString) return 'mai';
  const diff = Date.now() - new Date(isoString).getTime();
  const min = Math.floor(diff / 60000);
  if (min < 1) return 'adesso';
  if (min < 60) return min + ' min fa';
  const h = Math.floor(min / 60);
  if (h < 24) return h + 'h fa';
  return Math.floor(h / 24) + 'g fa';
}

/* ============================================================
   ESCAPE
============================================================ */
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
const escapeAttr = escapeHtml;

/* ============================================================
   PARSER iCAL
============================================================ */
function parseICS(text) {
  text = text.replace(/\r\n[ \t]/g, '').replace(/\n[ \t]/g, '').replace(/\r/g, '');
  const lines = text.split('\n');
  const events = [];
  let calName = null;
  let cur = null;
  for (const raw of lines) {
    const line = raw.trim();
    if (line.startsWith('X-WR-CALNAME:')) {
      calName = line.substring(13).trim();
      continue;
    }
    if (line === 'BEGIN:VEVENT') { cur = {}; continue; }
    if (line === 'END:VEVENT') { if (cur) events.push(cur); cur = null; continue; }
    if (!cur) continue;
    const idx = line.indexOf(':');
    if (idx < 0) continue;
    const key = line.substring(0, idx);
    const val = line.substring(idx + 1);
    const name = key.split(';')[0].toUpperCase();
    if (name === 'DTSTART') cur.start = extractDate(val);
    else if (name === 'DTEND') cur.end = extractDate(val);
    else if (name === 'SUMMARY') cur.summary = val.replace(/\\([\\;,])/g, '$1');
    else if (name === 'STATUS') cur.status = val.toUpperCase();
  }
  return {
    events: events.filter(e => e.start && e.end && e.status !== 'CANCELLED'),
    calName
  };
}
function extractDate(val) {
  const m = String(val).trim().match(/^(\d{4})(\d{2})(\d{2})/);
  if (!m) return null;
  return `${m[1]}-${m[2]}-${m[3]}`;
}
function isBlockedEvent(event) {
  if (event.source === 'Booking') return false;

  const summary = String(event.summary || '')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .toLowerCase()
    .trim();
  return /\b(not available|unavailable|blocked|non disponibile|bloccato|bloccata|date bloccate)\b/.test(summary);
}
function isReservationEvent(event) {
  return event.status !== 'CANCELLED' && !isBlockedEvent(event);
}
function deduplicateEvents(events) {
  const byStay = new Map();
  for (const event of events) {
    const key = `${event.roomId}|${event.start}|${event.end}`;
    const current = byStay.get(key);
    if (!current || (!isReservationEvent(current) && isReservationEvent(event))) {
      byStay.set(key, event);
    }
  }
  return Array.from(byStay.values());
}
function retainEventsFromFailedFeeds(events, cachedEvents, failedTasks) {
  const failedFeeds = new Set(failedTasks.map(task => `${task.roomId}|${task.sourceTag}`));
  return [
    ...events,
    ...cachedEvents.filter(event => failedFeeds.has(`${event.roomId}|${event.source}`))
  ];
}

/* ============================================================
   FETCH iCal (con timeout)
============================================================ */
async function fetchICS(url) {
  const proxy = (state.settings.proxy || '').trim();

  const ctrl = new AbortController();
  const timeout = setTimeout(() => ctrl.abort(), 20000);

  try {
    let target = url;
    if (proxy) {
      let proxyUrl;
      try {
        proxyUrl = new URL(proxy);
      } catch {
        throw new Error('URL del proxy non valido');
      }
      proxyUrl.searchParams.set('url', url);
      target = proxyUrl.toString();
    }

    const res = await fetch(target, { cache: 'no-store', signal: ctrl.signal });
    clearTimeout(timeout);
    if (!res.ok) {
      const responseText = await res.text();
      if (/invalid token/i.test(responseText)) {
        throw new Error('Token Booking non valido o scaduto: rigenera il link iCal in Booking e aggiornalo nelle impostazioni.');
      }
      throw new Error('HTTP ' + res.status);
    }
    const text = await res.text();
    if (!text.includes('BEGIN:VCALENDAR')) {
      if (text.includes('<html') || text.includes('<!DOCTYPE')) {
        throw new Error('Il server ha restituito una pagina HTML (URL non valido o protetto?)');
      }
      throw new Error('Risposta non valida (non è un iCal)');
    }
    return text;
  } catch (err) {
    clearTimeout(timeout);
    if (err.name === 'AbortError') throw new Error('Timeout (20s)');
    if (/Failed to fetch/i.test(err.message)) {
      throw new Error('Errore di rete / CORS bloccato');
    }
    throw err;
  }
}

/* ============================================================
   COSTRUZIONE TASK PER STANZA
============================================================ */
function buildTasksForRoom(room, roomId) {
  const tasks = [];

  if (room.airbnb && room.airbnb.trim()) {
    tasks.push({
      roomId,
      url: room.airbnb.trim(),
      label: room.name + ' · Airbnb',
      sourceTag: 'Airbnb'
    });
  }
  if (room.booking && room.booking.trim()) {
    tasks.push({
      roomId,
      url: room.booking.trim(),
      label: room.name + ' · Booking',
      sourceTag: 'Booking'
    });
  }

  return tasks;
}

/* ============================================================
   REFRESH
============================================================ */
async function refreshAll() {
  if (state.fetching) return;

  if (state.view === 'settings' && state.isAdmin) {
    try {
      await saveSettingsFromForm();
    } catch (err) {
      state.cloudError = 'Impossibile salvare le impostazioni su Firebase: ' + err.message;
      render();
      return;
    }
  }

  const rooms = state.settings.rooms;
  const tasks = [];
  rooms.forEach((room, i) => {
    tasks.push(...buildTasksForRoom(room, i));
  });

  if (tasks.length === 0) {
    state.errorMsg = null;
    state.fetching = false;
    render();
    return;
  }

  state.fetching = true;
  state.fetchProgress = { done: 0, total: tasks.length };
  state.errorMsg = null;
  render();

  const collected = [];
  const errors = [];
  const failedTasks = [];
  const cachedEvents = state.events;
  const newDetected = {};

  for (const task of tasks) {
    try {
      const text = await fetchICS(task.url);
      const parsed = parseICS(text);
      for (const e of parsed.events) {
        collected.push({
          roomId: task.roomId,
          start: e.start,
          end: e.end,
          summary: e.summary || '',
          status: e.status || '',
          source: task.sourceTag
        });
      }
      if (parsed.calName) {
        newDetected[task.roomId] = parsed.calName;
      }
    } catch (err) {
      errors.push(`${task.label}: ${err.message}`);
      failedTasks.push(task);
    }
    state.fetchProgress.done++;
    render();
  }

  state.events = deduplicateEvents(
    retainEventsFromFailedFeeds(collected, cachedEvents, failedTasks)
  );

  Object.assign(state.detectedNames, newDetected);
  saveDetectedLS();

  state.lastUpdate = new Date().toISOString();
  localStorage.setItem('pulizie_events', JSON.stringify(state.events));
  localStorage.setItem('pulizie_lastupdate', state.lastUpdate);

  if (errors.length) {
    state.errorMsg = errors.join('\n');
    state.lastErrorAt = new Date().toISOString();
    localStorage.setItem('pulizie_lasterror', state.lastErrorAt);
  } else {
    state.errorMsg = null;
    state.lastErrorAt = null;
    localStorage.removeItem('pulizie_lasterror');
  }

  state.fetching = false;
  render();
}

/* ============================================================
   LOGICA PULIZIE
============================================================ */
function getCleaningsForDate(dateKey) {
  const res = [];
  const n = state.settings.rooms.length;
  for (let r = 0; r < n; r++) {
    const evs = state.events.filter(e => e.roomId === r);
    const outEv = evs.find(e => e.end === dateKey && isReservationEvent(e));
    if (!outEv) continue;
    const inEv = evs.find(e => e.start === dateKey && isReservationEvent(e));
    res.push({
      roomId: r,
      hasCheckin: !!inEv,
      guestOut: outEv.summary || '',
      guestIn: inEv ? (inEv.summary || '') : '',
      source: outEv.source || ''
    });
  }
  return res;
}

function getRoomStatus(roomId, dateKey) {
  const evs = state.events.filter(e => e.roomId === roomId);
  const reservations = evs.filter(isReservationEvent);
  const checkout = reservations.some(e => e.end === dateKey);
  const checkin  = reservations.some(e => e.start === dateKey);
  const occupied = evs.some(e => e.start <= dateKey && dateKey < e.end);
  if (checkout && checkin) return 'both';
  if (checkout) return 'checkout';
  if (occupied) return 'occupied';
  return 'free';
}

function statusIcon(s) {
  if (s === 'both') return '⚠️';
  if (s === 'checkout') return '🧹';
  if (s === 'occupied') return '🟢';
  return '○';
}
function statusClass(s) {
  if (s === 'both') return 'both';
  if (s === 'checkout') return 'checkout';
  if (s === 'occupied') return 'occupied';
  return 'free';
}
function statusLabel(s) {
  if (s === 'both') return 'Check-out + Nuovo check-in';
  if (s === 'checkout') return 'Check-out / Pulizia';
  if (s === 'occupied') return 'Occupata';
  return 'Libera';
}
function cleanGuestName(summary) {
  if (!summary) return null;
  const s = summary.trim();
  if (!s) return null;
  if (/^(reserved|not available|blocked|closed|unavailable|airbnb|booking\.?com?|n\/a)$/i.test(s)) return null;
  if (/not available|blocked|reserved|closed/i.test(s)) return null;
  return s;
}
function shortName(name) {
  const m = String(name).match(/\d+/);
  if (m) return m[0];
  return String(name).substring(0, 3);
}

/* ============================================================
   SYNC STATUS
============================================================ */
function computeSyncStatus() {
  if (state.fetching) return { dot: 'loading', text: `⟳ ${state.fetchProgress.done}/${state.fetchProgress.total}` };
  if (state.errorMsg && state.lastErrorAt) return { dot: 'err', text: '⚠️ errore' };
  if (!state.lastUpdate) return { dot: '', text: '' };
  const age = Date.now() - new Date(state.lastUpdate).getTime();
  if (age < STALE_MS) return { dot: 'ok', text: '✓ sincronizzato' };
  if (age < VERY_STALE_MS) return { dot: 'stale', text: '⏱ ' + timeSince(state.lastUpdate) };
  return { dot: 'err', text: '⏱ ' + timeSince(state.lastUpdate) };
}

/* ============================================================
   RENDER
============================================================ */
function render() {
  const sync = computeSyncStatus();
  document.getElementById('syncDot').className = 'sync-dot ' + sync.dot;

  const lu = document.getElementById('lastUpdate');
  if (state.fetching) {
    lu.textContent = `Aggiornamento in corso… (${state.fetchProgress.done}/${state.fetchProgress.total})`;
  } else {
    lu.textContent = 'Ultimo aggiornamento: ' +
      (state.lastUpdate ? formatTime(state.lastUpdate) : '—');
  }
  document.getElementById('syncStatus').textContent = sync.text;

  document.getElementById('refreshIcon').className = state.fetching ? 'spin' : '';
  document.getElementById('lockBtn').textContent = state.isAdmin ? '🔓' : '🔒';

  renderNav();

  const main = document.getElementById('main');
  if (state.view === 'home') main.innerHTML = viewHome();
  else if (state.view === 'calendar') main.innerHTML = viewCalendar();
  else if (state.view === 'settings') main.innerHTML = viewSettings();
  if (state.cloudError) {
    main.insertAdjacentHTML('afterbegin',
      `<div class="error-box">⚠️ <strong>Sincronizzazione Firebase</strong><br>${escapeHtml(state.cloudError)}</div>`);
  }
}

function renderNav() {
  const items = [
    { id:'home',     icon:'🏠', label:'Pulizie' },
    { id:'calendar', icon:'📅', label:'Calendario' }
  ];
  if (state.isAdmin) items.push({ id:'settings', icon:'⚙️', label:'Impostazioni' });

  document.getElementById('nav').innerHTML = items.map(it => `
    <button class="nav-btn ${state.view === it.id ? 'active' : ''}" data-view="${it.id}">
      <span class="nav-icon">${it.icon}</span>
      <span class="nav-label">${it.label}</span>

  `).join('');
}

============================================================ */
function viewHome() {
  const today = new Date();
  const days = [];
  for (let i = 0; i < 7; i++) days.push(addDays(today, i));

  const cToday = getCleaningsForDate(toKey(days[0]));
  const cTom   = getCleaningsForDate(toKey(days[1]));
  const cAfter = getCleaningsForDate(toKey(days[2]));

  let total7 = 0;
  days.forEach(d => { total7 += getCleaningsForDate(toKey(d)).length; });

  let html = '';

  html += `<div class="dashboard">
    <div class="stat">
      <div class="stat-num">${cToday.length}</div>
      <div class="stat-lbl">Pulizie oggi</div>
      <div class="stat-date">${shortDate(days[0])}</div>
    </div>
    <div class="stat">
      <div class="stat-num">${cTom.length}</div>
      <div class="stat-lbl">Pulizie domani</div>
      <div class="stat-date">${shortDate(days[1])}</div>
    </div>
    <div class="stat">
      <div class="stat-num">${cAfter.length}</div>
      <div class="stat-lbl">Dopodomani</div>
      <div class="stat-date">${shortDate(days[2])}</div>
    </div>
    <div class="stat wide">
      <div class="stat-num">${total7}</div>
      <div class="stat-lbl">Pulizie prossimi 7 giorni</div>
    </div>
  </div>`;

  if (state.fetching && state.fetchProgress.total > 0) {
    html += `<div class="empty">⏳ Aggiornamento calendari… (${state.fetchProgress.done}/${state.fetchProgress.total})</div>`;
  }

  if (state.errorMsg) {
    html += `<div class="error-box">⚠️ <strong>Errori recupero calendari</strong><br>${
      escapeHtml(state.errorMsg).replace(/\n/g, '<br>')}
      <br><br><em>Se vedi "CORS bloccato" o "Errore di rete", prova a impostare un proxy diverso in Impostazioni o configura un Cloudflare Worker personale.</em>
    </div>`;
  }

  const noUrls = state.settings.rooms.every(r => {
    return !r.airbnb && !r.booking;
  });

  if (noUrls) {
    html += `<div class="empty">
      Nessun calendario configurato.<br><br>
      ${state.isAdmin
        ? 'Vai su <strong>⚙️ Impostazioni</strong> per configurare le fonti dei calendari.'
        : 'Contatta l\'amministratore per configurare i calendari.'}
    </div>`;
    return html;
  }

  days.forEach((d, idx) => {
    const dk = toKey(d);
    const cleanings = getCleaningsForDate(dk);

    html += `<div class="day-block">`;
    html += `<div class="day-header">${dayLabel(d, idx)}</div>`;

    if (cleanings.length === 0) {
      html += `<div class="no-clean">Nessuna pulizia prevista</div>`;
    } else {
      cleanings.forEach(c => { html += renderCleaningCard(dk, c); });
    }
    html += `</div>`;
  });

  return html;
}

function dayLabel(d, idx) {
  const base =
    idx === 0 ? 'OGGI' :
    idx === 1 ? 'DOMANI' :
    idx === 2 ? 'DOPODOMANI' :
    GIORNI[d.getDay()].toUpperCase();
  return `${base} — ${d.getDate()} ${MESI[d.getMonth()].toUpperCase()}`;
}

function renderCleaningCard(dk, c) {
  const room = state.settings.rooms[c.roomId];
  const both = c.hasCheckin;

  let cls = 'clean-card';
  if (both) cls += ' both';

  const guest = state.settings.showGuestName ? cleanGuestName(c.guestOut) : null;
  const srcBadge = c.source
    ? `<span class="src-badge direct">${escapeHtml(c.source)}</span>`
    : '';

  return `
  <div class="${cls}">
    <div class="cc-top">
      <div class="cc-room">🧹 ${escapeHtml(room.name.toUpperCase())}${srcBadge}</div>
    </div>
    <div class="cc-info">Check-out: ${escapeHtml(state.settings.checkoutTime)}</div>
    ${both ? `<div class="cc-both">⚠️ CHECK-OUT + NUOVO CHECK-IN (${escapeHtml(state.settings.checkinTime)})</div>` : ''}
    ${guest ? `<div class="cc-guest">👤 ${escapeHtml(guest)}</div>` : ''}
  </div>`;
}

  if (!el) {
    el = document.createElement('div');

            inputmode="numeric" autocomplete="current-password" required>
          <div class="error-box" data-auth-error hidden></div>
          <button class="btn btn-primary" type="submit">Sblocca</button>
          <button class="btn btn-close" type="button" data-action="closeModal">Annulla</button>
        </form>
      </div>`;
  }
});

/* ============================================================
   AVVIO
============================================================ */
loadAll();
render();
(async () => {
  try {
    await loadCloudSettings();
  } catch (err) {
    state.cloudError = 'Impossibile caricare le impostazioni da Firebase: ' + err.message;
  }
  render();
  refreshAll();
})();

setInterval(() => { refreshAll(); }, AUTO_UPDATE_MS);

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) {
    const lu = state.lastUpdate ? new Date(state.lastUpdate).getTime() : 0;
    if (Date.now() - lu > VISIBILITY_THRESHOLD_MS) refreshAll();
  }
});
</script>
</body>
</html>
